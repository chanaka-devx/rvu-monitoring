name: rvu-monitoring

services:
  postgres:
    image: postgres:16-alpine
    container_name: rvu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rvu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rvu}
      POSTGRES_DB: ${POSTGRES_DB:-rvu_monitoring}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - rvu-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-rvu} -d ${POSTGRES_DB:-rvu_monitoring}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  rvu-postgres-data:
